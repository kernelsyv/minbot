<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Incoming Minecraft packet pipeline</title>
  <desc id="description">TCP bytes are length checked, optionally decompressed, decoded by packet ID, and routed to session, chat, authentication, or chunk handlers. Malformed and oversized packets are rejected before state updates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#1f2937"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .heading { font-size: 27px; font-weight: 650; fill: #111827; }
      .sub { font-size: 14px; fill: #4b5563; }
      .index { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #6b7280; }
      .name { font-size: 16px; font-weight: 650; fill: #111827; }
      .copy { font-size: 12px; fill: #4b5563; }
      .row { font-size: 12px; font-weight: 600; fill: #1f2937; }
      .small { font-size: 11px; fill: #6b7280; }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#fafaf8"/>
  <g class="sans">
    <text x="48" y="53" class="heading">Incoming packet pipeline</text>
    <text x="48" y="79" class="sub">Network input is validated before any session or world state can change.</text>
    <line x1="48" y1="104" x2="1152" y2="104" stroke="#d1d5db"/>

    <!-- Connectors -->
    <line x1="226" y1="205" x2="270" y2="205" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="454" y1="205" x2="498" y2="205" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="682" y1="205" x2="726" y2="205" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="910" y1="205" x2="954" y2="205" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arrow)"/>

    <!-- Source -->
    <rect x="48" y="143" width="178" height="124" rx="3" fill="#ffffff" stroke="#9ca3af"/>
    <text x="66" y="174" class="mono index">INPUT</text>
    <text x="66" y="206" class="name">TCP bytes</text>
    <text x="66" y="234" class="mono copy">01 af 03 ...</text>

    <!-- Frame -->
    <rect x="270" y="143" width="184" height="124" rx="3" fill="#ffffff" stroke="#9ca3af"/>
    <text x="288" y="174" class="mono index">01 · FRAME</text>
    <text x="288" y="206" class="name">Read VarInt length</text>
    <text x="288" y="234" class="copy">maximum 16 MiB</text>

    <!-- Compression -->
    <rect x="498" y="143" width="184" height="124" rx="3" fill="#ffffff" stroke="#9ca3af"/>
    <text x="516" y="174" class="mono index">02 · DECODE</text>
    <text x="516" y="206" class="name">Decompress if set</text>
    <text x="516" y="234" class="copy">zlib threshold checks</text>

    <!-- Dispatch -->
    <rect x="726" y="143" width="184" height="124" rx="3" fill="#ffffff" stroke="#2255d6" stroke-width="1.5"/>
    <rect x="726" y="143" width="5" height="124" fill="#2255d6"/>
    <text x="748" y="174" class="mono index" fill="#2255d6">03 · ROUTE</text>
    <text x="748" y="206" class="name">Dispatch packet</text>
    <text x="748" y="234" class="copy">state + packet ID</text>

    <!-- Handlers -->
    <rect x="954" y="125" width="198" height="160" rx="3" fill="#ffffff" stroke="#9ca3af"/>
    <text x="972" y="154" class="mono index">04 · UPDATE</text>
    <line x1="972" y1="169" x2="1134" y2="169" stroke="#e5e7eb"/>
    <text x="972" y="192" class="row">session</text>
    <text x="1134" y="192" text-anchor="end" class="mono small">keep-alive</text>
    <line x1="972" y1="203" x2="1134" y2="203" stroke="#e5e7eb"/>
    <text x="972" y="226" class="row">chat / auth</text>
    <text x="1134" y="226" text-anchor="end" class="mono small">messages</text>
    <line x1="972" y1="237" x2="1134" y2="237" stroke="#e5e7eb"/>
    <text x="972" y="260" class="row">world</text>
    <text x="1134" y="260" text-anchor="end" class="mono small">chunks</text>

    <!-- Safety note -->
    <rect x="270" y="301" width="640" height="38" rx="2" fill="#eef3ff" stroke="#a8bcef"/>
    <rect x="270" y="301" width="5" height="38" fill="#2255d6"/>
    <text x="292" y="325" class="mono small" fill="#173f9f">reject: malformed VarInt · invalid zlib size · oversized frame · truncated payload</text>

    <line x1="48" y1="366" x2="1152" y2="366" stroke="#d1d5db"/>
    <text x="48" y="389" class="mono small">diagram: guarded processing pipeline · source: minbot 0.1.4</text>
    <text x="1152" y="389" text-anchor="end" class="mono small">all paths shown are explicit</text>
  </g>
</svg>
