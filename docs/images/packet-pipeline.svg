<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Incoming Minecraft packet pipeline</title>
  <desc id="description">Network bytes pass through packet limits, frame decoding, optional decompression, and dispatch before updating session, chat, authentication, or chunk state.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #c084fc; }
      .heading { font-size: 30px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 15px; fill: #94a3b8; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
      .title { font-size: 17px; font-weight: 700; fill: #f8fafc; }
      .copy { font-size: 12.5px; fill: #94a3b8; }
      .handler { font-size: 13px; font-weight: 650; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#background)"/>
  <circle cx="1180" cy="468" r="170" fill="#a855f7" opacity="0.025"/>

  <g class="font">
    <text x="58" y="56" class="eyebrow">PACKET PIPELINE</text>
    <text x="58" y="94" class="heading">Validate first. Decode once. Dispatch clearly.</text>
    <text x="58" y="122" class="subtitle">Untrusted network data cannot reach bot state before framing and safety checks.</text>

    <!-- main route -->
    <path d="M213 284 H268" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M458 284 H513" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M703 284 H758" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M958 284 H1013" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- bytes -->
    <g filter="url(#shadow)">
      <rect x="58" y="202" width="155" height="164" rx="18" fill="#161b22" stroke="#30363d"/>
      <rect x="82" y="226" width="107" height="48" rx="10" fill="#172033" stroke="#334155"/>
      <text x="135.5" y="256" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#94a3b8">01 AF 03 ...</text>
      <text x="82" y="307" class="label">NETWORK</text>
      <text x="82" y="334" class="title">TCP bytes</text>
    </g>

    <!-- frame guard -->
    <g filter="url(#shadow)">
      <rect x="268" y="184" width="190" height="200" rx="18" fill="#161b22" stroke="#30363d"/>
      <rect x="292" y="208" width="50" height="50" rx="12" fill="#17243a"/>
      <path d="M307 233 H327 M317 223 V243" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
      <text x="292" y="294" class="label">01 · FRAME</text>
      <text x="292" y="322" class="title">VarInt length</text>
      <text x="292" y="348" class="copy">16 MiB hard limit</text>
    </g>

    <!-- decompression -->
    <g filter="url(#shadow)">
      <rect x="513" y="184" width="190" height="200" rx="18" fill="#161b22" stroke="#30363d"/>
      <rect x="537" y="208" width="50" height="50" rx="12" fill="#2a2037"/>
      <path d="M550 222 H574 L567 230 574 238 H550 L557 230Z" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="537" y="294" class="label">02 · DECODE</text>
      <text x="537" y="322" class="title">zlib if needed</text>
      <text x="537" y="348" class="copy">threshold + size checks</text>
    </g>

    <!-- dispatcher -->
    <g filter="url(#shadow)">
      <rect x="758" y="184" width="200" height="200" rx="18" fill="#172033" stroke="#40516a"/>
      <circle cx="800" cy="233" r="25" fill="#152b27"/>
      <circle cx="800" cy="233" r="6" fill="#34d399"/>
      <path d="M800 216 V208 M800 258 V250 M783 233 H775 M825 233 H817" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
      <text x="790" y="294" class="label">03 · ROUTE</text>
      <text x="790" y="322" class="title">Packet dispatcher</text>
      <text x="790" y="348" class="copy">state + packet ID</text>
    </g>

    <!-- handlers -->
    <g filter="url(#shadow)">
      <rect x="1013" y="166" width="145" height="236" rx="18" fill="#161b22" stroke="#30363d"/>
      <text x="1035" y="198" class="label">04 · HANDLE</text>

      <rect x="1035" y="216" width="101" height="32" rx="8" fill="#14251f" stroke="#285442"/>
      <circle cx="1050" cy="232" r="4" fill="#34d399"/>
      <text x="1062" y="237" class="handler">session</text>

      <rect x="1035" y="260" width="101" height="32" rx="8" fill="#172336" stroke="#2d4b73"/>
      <circle cx="1050" cy="276" r="4" fill="#60a5fa"/>
      <text x="1062" y="281" class="handler">chat</text>

      <rect x="1035" y="304" width="101" height="32" rx="8" fill="#231936" stroke="#4c2c6f"/>
      <circle cx="1050" cy="320" r="4" fill="#c084fc"/>
      <text x="1062" y="325" class="handler">auth</text>

      <rect x="1035" y="348" width="101" height="32" rx="8" fill="#282317" stroke="#5f512b"/>
      <circle cx="1050" cy="364" r="4" fill="#fbbf24"/>
      <text x="1062" y="369" class="handler">chunks</text>
    </g>

    <!-- safety rail -->
    <rect x="268" y="418" width="690" height="46" rx="14" fill="#111923" stroke="#26384d"/>
    <path d="M293 440 L300 447 313 432" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="329" y="446" font-size="12.5" font-weight="600" fill="#cbd5e1">malformed packet → controlled error · oversized packet → rejected</text>
  </g>
</svg>
