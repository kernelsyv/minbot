<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">Minecraft connection lifecycle</title>
  <desc id="description">The bot connects over TCP, sends a handshake, logs in, exchanges configuration packets, and enters an active play loop.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#475569"/>
    </marker>
    <style>
      .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #38bdf8; }
      .heading { font-size: 30px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 15px; fill: #94a3b8; }
      .step { font-size: 12px; font-weight: 700; letter-spacing: 1.3px; fill: #94a3b8; }
      .title { font-size: 17px; font-weight: 700; fill: #f8fafc; }
      .copy { font-size: 12.5px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <path d="M50 227 H1150" stroke="#263244" stroke-width="2"/>

  <g class="font">
    <text x="58" y="56" class="eyebrow">CONNECTION LIFECYCLE</text>
    <text x="58" y="94" class="heading">One session, five explicit stages.</text>
    <text x="58" y="122" class="subtitle">Each transition is driven by protocol packets—not timing guesses.</text>

    <!-- connectors -->
    <path d="M201 227 H277" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M421 227 H497" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M641 227 H717" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M861 227 H937" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- step 1 -->
    <g filter="url(#shadow)">
      <circle cx="131" cy="227" r="70" fill="#161b22" stroke="#334155"/>
      <circle cx="131" cy="227" r="46" fill="#172033"/>
      <path d="M108 229 H154 M115 217 L108 229 115 241 M147 217 L154 229 147 241" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="131" y="326" text-anchor="middle" class="step">01 · CONNECT</text>
    <text x="131" y="352" text-anchor="middle" class="title">TCP socket</text>
    <text x="131" y="375" text-anchor="middle" class="copy">host + port</text>

    <!-- step 2 -->
    <g filter="url(#shadow)">
      <circle cx="351" cy="227" r="70" fill="#161b22" stroke="#334155"/>
      <circle cx="351" cy="227" r="46" fill="#172033"/>
      <path d="M328 240 C337 224 345 216 351 216 C358 216 365 224 374 240" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
      <circle cx="351" cy="209" r="7" fill="#60a5fa"/>
    </g>
    <text x="351" y="326" text-anchor="middle" class="step">02 · HANDSHAKE</text>
    <text x="351" y="352" text-anchor="middle" class="title">Choose intent</text>
    <text x="351" y="375" text-anchor="middle" class="copy">status or login</text>

    <!-- step 3 -->
    <g filter="url(#shadow)">
      <circle cx="571" cy="227" r="70" fill="#161b22" stroke="#334155"/>
      <circle cx="571" cy="227" r="46" fill="#172033"/>
      <circle cx="571" cy="215" r="10" fill="none" stroke="#c084fc" stroke-width="3"/>
      <path d="M550 242 C554 230 562 226 571 226 C581 226 589 230 592 242" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="571" y="326" text-anchor="middle" class="step">03 · LOGIN</text>
    <text x="571" y="352" text-anchor="middle" class="title">Offline identity</text>
    <text x="571" y="375" text-anchor="middle" class="copy">username + compression</text>

    <!-- step 4 -->
    <g filter="url(#shadow)">
      <circle cx="791" cy="227" r="70" fill="#161b22" stroke="#334155"/>
      <circle cx="791" cy="227" r="46" fill="#172033"/>
      <path d="M769 215 H813 M769 227 H813 M769 239 H801" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <circle cx="775" cy="215" r="3" fill="#fbbf24"/>
      <circle cx="775" cy="227" r="3" fill="#fbbf24"/>
      <circle cx="775" cy="239" r="3" fill="#fbbf24"/>
    </g>
    <text x="791" y="326" text-anchor="middle" class="step">04 · CONFIGURE</text>
    <text x="791" y="352" text-anchor="middle" class="title">Client settings</text>
    <text x="791" y="375" text-anchor="middle" class="copy">server configuration</text>

    <!-- step 5 -->
    <g filter="url(#shadow)">
      <circle cx="1011" cy="227" r="72" fill="#13251f" stroke="#2f6b51" stroke-width="2"/>
      <circle cx="1011" cy="227" r="46" fill="#123326"/>
      <path d="M991 228 L1005 242 1032 211" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1061" cy="177" r="16" fill="#34d399"/>
      <path d="M1054 177 H1068 M1061 170 V184" stroke="#052e22" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="1011" y="326" text-anchor="middle" class="step" fill="#6ee7b7">05 · PLAY</text>
    <text x="1011" y="352" text-anchor="middle" class="title">Active loop</text>
    <text x="1011" y="375" text-anchor="middle" class="copy">chat · chunks · keep-alive</text>

    <rect x="484" y="407" width="174" height="28" rx="14" fill="#231936" stroke="#4c2c6f"/>
    <circle cx="501" cy="421" r="4" fill="#c084fc"/>
    <text x="512" y="425" font-size="11.5" font-weight="600" fill="#d8b4fe">optional /register · /login</text>
  </g>
</svg>
