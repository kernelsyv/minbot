<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">Minecraft connection lifecycle</title>
  <desc id="description">A left-to-right state flow: TCP connected, handshake sent, login accepted, configuration completed, then play state. Optional register and login chat commands run after joining servers that require them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#1f2937"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .heading { font-size: 27px; font-weight: 650; fill: #111827; }
      .sub { font-size: 14px; fill: #4b5563; }
      .index { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #6b7280; }
      .state { font-size: 16px; font-weight: 650; fill: #111827; }
      .copy { font-size: 12px; fill: #4b5563; }
      .event { font-size: 10.5px; fill: #6b7280; }
      .small { font-size: 11px; fill: #6b7280; }
    </style>
  </defs>

  <rect width="1200" height="390" fill="#fafaf8"/>
  <g class="sans">
    <text x="48" y="53" class="heading">Connection lifecycle</text>
    <text x="48" y="79" class="sub">Each transition follows a server packet or completed exchange.</text>
    <line x1="48" y1="104" x2="1152" y2="104" stroke="#d1d5db"/>

    <!-- Connectors and event labels -->
    <line x1="244" y1="192" x2="278" y2="192" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="261" y="126" text-anchor="middle" class="mono event">socket ready</text>
    <line x1="454" y1="192" x2="488" y2="192" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="471" y="126" text-anchor="middle" class="mono event">Login Success</text>
    <line x1="664" y1="192" x2="698" y2="192" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="681" y="126" text-anchor="middle" class="mono event">Finish Config</text>
    <line x1="874" y1="192" x2="908" y2="192" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="891" y="126" text-anchor="middle" class="mono event">Play packets</text>

    <!-- States -->
    <rect x="68" y="136" width="176" height="112" rx="3" fill="#ffffff" stroke="#9ca3af"/>
    <text x="86" y="165" class="mono index">01</text>
    <text x="86" y="197" class="state">TCP connect</text>
    <text x="86" y="222" class="copy">open host and port</text>

    <rect x="278" y="136" width="176" height="112" rx="3" fill="#ffffff" stroke="#9ca3af"/>
    <text x="296" y="165" class="mono index">02</text>
    <text x="296" y="197" class="state">Handshake</text>
    <text x="296" y="222" class="copy">select login intent</text>

    <rect x="488" y="136" width="176" height="112" rx="3" fill="#ffffff" stroke="#9ca3af"/>
    <text x="506" y="165" class="mono index">03</text>
    <text x="506" y="197" class="state">Login</text>
    <text x="506" y="222" class="copy">identity + compression</text>

    <rect x="698" y="136" width="176" height="112" rx="3" fill="#ffffff" stroke="#9ca3af"/>
    <text x="716" y="165" class="mono index">04</text>
    <text x="716" y="197" class="state">Configuration</text>
    <text x="716" y="222" class="copy">client settings exchange</text>

    <rect x="908" y="136" width="224" height="112" rx="3" fill="#ffffff" stroke="#2255d6" stroke-width="2"/>
    <rect x="908" y="136" width="6" height="112" fill="#2255d6"/>
    <text x="932" y="165" class="mono index" fill="#2255d6">05 · ACTIVE</text>
    <text x="932" y="197" class="state">Play</text>
    <text x="932" y="222" class="copy">chat · movement · chunks</text>

    <!-- Post-join server authentication -->
    <line x1="1020" y1="248" x2="1020" y2="285" stroke="#2255d6" stroke-width="1.4"/>
    <line x1="1020" y1="285" x2="790" y2="285" stroke="#2255d6" stroke-width="1.4"/>
    <rect x="602" y="269" width="188" height="33" rx="2" fill="#eef3ff" stroke="#a8bcef"/>
    <text x="696" y="290" text-anchor="middle" class="mono small" fill="#173f9f">optional /register → /login</text>

    <line x1="48" y1="346" x2="1152" y2="346" stroke="#d1d5db"/>
    <text x="48" y="369" class="mono small">diagram: protocol state flow · source: minbot 0.1.5</text>
    <text x="1152" y="369" text-anchor="end" class="mono small">Minecraft Java 1.21.1 · 767</text>
  </g>
</svg>
