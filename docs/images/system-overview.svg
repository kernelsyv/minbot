<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">minbot system overview</title>
  <desc id="description">A terminal controls the minbot C++ protocol core, which connects directly to a Minecraft Java server and updates chat and world state.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#121a29"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #34d399; }
      .heading { font-size: 30px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 15px; fill: #94a3b8; }
      .card-title { font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .card-copy { font-size: 13px; fill: #94a3b8; }
      .module { font-size: 13px; font-weight: 600; fill: #dbeafe; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#background)"/>
  <circle cx="1112" cy="48" r="120" fill="#22c55e" opacity="0.035"/>
  <circle cx="96" cy="506" r="150" fill="#38bdf8" opacity="0.03"/>

  <g class="font">
    <text x="58" y="56" class="eyebrow">SYSTEM OVERVIEW</text>
    <text x="58" y="94" class="heading">Small core. Direct protocol. Clear state.</text>
    <text x="58" y="122" class="subtitle">C++20 client with no high-level Minecraft bot framework.</text>

    <!-- Terminal -->
    <g filter="url(#shadow)">
      <rect x="58" y="184" width="228" height="212" rx="18" fill="#161b22" stroke="#30363d"/>
      <rect x="58" y="184" width="228" height="38" rx="18" fill="#1f2937"/>
      <path d="M58 204 Q58 184 78 184 H266 Q286 184 286 204 V222 H58Z" fill="#1f2937"/>
      <circle cx="80" cy="203" r="4" fill="#fb7185"/>
      <circle cx="94" cy="203" r="4" fill="#fbbf24"/>
      <circle cx="108" cy="203" r="4" fill="#34d399"/>
      <text x="84" y="258" class="label">OPERATOR</text>
      <text x="84" y="287" class="card-title">Terminal</text>
      <text x="84" y="317" class="card-copy">commands + chat</text>
      <rect x="84" y="340" width="176" height="32" rx="8" fill="#0d1117" stroke="#263244"/>
      <text x="98" y="361" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#86efac">&gt; minbot play ...</text>
    </g>

    <!-- Protocol core -->
    <g filter="url(#shadow)">
      <rect x="370" y="154" width="460" height="286" rx="22" fill="url(#core)" stroke="#3b4b63"/>
      <rect x="394" y="177" width="82" height="24" rx="12" fill="#123326"/>
      <circle cx="409" cy="189" r="4" fill="#34d399"/>
      <text x="420" y="193" font-size="11" font-weight="700" fill="#86efac">C++20</text>
      <text x="394" y="236" class="card-title">minbot protocol core</text>
      <text x="394" y="260" class="card-copy">Minecraft Java 1.21.1 · protocol 767</text>

      <rect x="394" y="286" width="124" height="44" rx="10" fill="#18263b" stroke="#2d4666"/>
      <text x="456" y="313" text-anchor="middle" class="module">VarInt + frames</text>
      <rect x="530" y="286" width="124" height="44" rx="10" fill="#18263b" stroke="#2d4666"/>
      <text x="592" y="313" text-anchor="middle" class="module">zlib stream</text>
      <rect x="666" y="286" width="140" height="44" rx="10" fill="#18263b" stroke="#2d4666"/>
      <text x="736" y="313" text-anchor="middle" class="module">state machine</text>

      <rect x="394" y="346" width="196" height="64" rx="12" fill="#14251f" stroke="#285442"/>
      <circle cx="417" cy="369" r="6" fill="#34d399" opacity="0.9"/>
      <text x="434" y="373" class="module" fill="#d1fae5">chat + authentication</text>
      <text x="417" y="395" class="card-copy">messages and server commands</text>

      <rect x="606" y="346" width="200" height="64" rx="12" fill="#172336" stroke="#2d4b73"/>
      <path d="M630 362 h12 v12 h-12z M644 362 h12 v12 h-12z M630 376 h12 v12 h-12z M644 376 h12 v12 h-12z" fill="#60a5fa" opacity="0.85"/>
      <text x="671" y="373" class="module">world model</text>
      <text x="671" y="395" class="card-copy">loaded chunk coordinates</text>
    </g>

    <!-- Server -->
    <g filter="url(#shadow)">
      <rect x="914" y="184" width="228" height="212" rx="18" fill="#161b22" stroke="#30363d"/>
      <rect x="946" y="218" width="164" height="62" rx="12" fill="#1b2838" stroke="#334155"/>
      <circle cx="970" cy="249" r="8" fill="#34d399"/>
      <rect x="992" y="235" width="88" height="7" rx="3.5" fill="#64748b"/>
      <rect x="992" y="252" width="66" height="7" rx="3.5" fill="#334155"/>
      <text x="946" y="320" class="label">REMOTE</text>
      <text x="946" y="349" class="card-title">Minecraft server</text>
      <text x="946" y="376" class="card-copy">offline-mode session</text>
    </g>

    <!-- Connections -->
    <path d="M286 282 C318 282 334 282 360 282" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="325" y="268" text-anchor="middle" class="label">INPUT</text>
    <path d="M830 282 C860 282 878 282 904 282" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="870" y="268" text-anchor="middle" class="label">TCP</text>
    <path d="M904 310 C878 310 860 310 834 310" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="870" y="335" text-anchor="middle" class="label">PACKETS</text>
  </g>
</svg>
