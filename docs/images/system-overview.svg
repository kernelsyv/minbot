<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">minbot system overview</title>
  <desc id="description">The operator sends terminal input to the minbot C++ protocol client. minbot exchanges Minecraft protocol 767 packets with an offline-mode Java server and maintains chat, authentication, session, and chunk state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#1f2937"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .heading { font-size: 27px; font-weight: 650; fill: #111827; }
      .sub { font-size: 14px; fill: #4b5563; }
      .section { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; fill: #111827; }
      .name { font-size: 18px; font-weight: 650; fill: #111827; }
      .copy { font-size: 13px; fill: #4b5563; }
      .small { font-size: 11px; fill: #6b7280; }
      .module { font-size: 12.5px; font-weight: 600; fill: #1f2937; }
    </style>
  </defs>

  <rect width="1200" height="430" fill="#fafaf8"/>
  <g class="sans">
    <text x="48" y="53" class="heading">System overview</text>
    <text x="48" y="79" class="sub">The client speaks the Minecraft protocol directly; no high-level bot framework sits in the path.</text>
    <line x1="48" y1="104" x2="1152" y2="104" stroke="#d1d5db"/>

    <!-- Operator -->
    <rect x="48" y="158" width="210" height="150" rx="3" fill="#ffffff" stroke="#9ca3af"/>
    <rect x="48" y="158" width="210" height="6" fill="#111827"/>
    <text x="68" y="193" class="section">OPERATOR</text>
    <text x="68" y="224" class="name">Terminal</text>
    <text x="68" y="252" class="copy">commands and chat input</text>
    <text x="68" y="283" class="mono small">minbot play &lt;host&gt; &lt;name&gt;</text>

    <!-- minbot boundary -->
    <rect x="334" y="132" width="532" height="224" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    <rect x="334" y="132" width="532" height="6" fill="#2255d6"/>
    <text x="356" y="169" class="section">MINBOT · C++20</text>
    <text x="356" y="198" class="name">Protocol client</text>
    <text x="356" y="223" class="copy">Minecraft Java 1.21.1 · protocol 767</text>

    <rect x="356" y="248" width="146" height="42" rx="2" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="429" y="274" text-anchor="middle" class="module">packet framing</text>
    <rect x="514" y="248" width="146" height="42" rx="2" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="587" y="274" text-anchor="middle" class="module">zlib compression</text>
    <rect x="672" y="248" width="172" height="42" rx="2" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="758" y="274" text-anchor="middle" class="module">protocol state machine</text>

    <line x1="356" y1="310" x2="844" y2="310" stroke="#d1d5db"/>
    <text x="356" y="337" class="copy">state:</text>
    <text x="401" y="337" class="mono small">session / chat / authentication / loaded chunks</text>

    <!-- Server -->
    <rect x="942" y="158" width="210" height="150" rx="3" fill="#ffffff" stroke="#9ca3af"/>
    <rect x="942" y="158" width="210" height="6" fill="#111827"/>
    <text x="962" y="193" class="section">REMOTE SYSTEM</text>
    <text x="962" y="224" class="name">Java server</text>
    <text x="962" y="252" class="copy">offline-mode session</text>
    <text x="962" y="283" class="mono small">host:25565</text>

    <!-- Relationships -->
    <line x1="258" y1="218" x2="324" y2="218" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="291" y="201" text-anchor="middle" class="mono small">stdin</text>

    <line x1="866" y1="211" x2="932" y2="211" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="899" y="194" text-anchor="middle" class="mono small">TCP</text>
    <line x1="932" y1="251" x2="876" y2="251" stroke="#1f2937" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="904" y="273" text-anchor="middle" class="mono small">packets</text>

    <line x1="48" y1="386" x2="1152" y2="386" stroke="#d1d5db"/>
    <text x="48" y="409" class="mono small">scope: runtime components · source: minbot 0.1.4</text>
    <text x="1152" y="409" text-anchor="end" class="mono small">docs/images/system-overview.svg</text>
  </g>
</svg>
